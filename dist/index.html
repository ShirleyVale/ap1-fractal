<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP1 · 交互式 2D 分形</title><link rel="stylesheet" href="style.css"></head><body>
<main><section class="stage"><div class="topbar"><div><span class="eyebrow">INTERACTIVE COMPUTER GRAPHICS · AP1</span><h1>交互式 2D 分形</h1></div><div class="status"><span id="statusDot"></span><span id="statusText">逐点生长中</span></div></div><canvas id="glCanvas" aria-label="Sierpinski 垫片 WebGL 画布"></canvas><div class="canvasTip">拖动平移 · 滚轮缩放 · <kbd>1</kbd>点云 <kbd>2</kbd>线框 <kbd>3</kbd>实体 · <kbd>Space</kbd>暂停</div></section>
<aside class="panel"><section><h2>生成方法</h2><div class="segmented"><button data-alg="chaos" class="active">混沌游戏</button><button data-alg="recursive">递归细分</button></div><p id="algorithmNote">随机选一个顶点，将当前点向它移动一半。重复后得到 Sierpinski 垫片。</p></section>
<section><label>图形类型 <select id="shape"><option value="3">三角垫片</option><option value="5">五边形扩展 +2</option><option value="6">六边形扩展 +2</option></select></label></section>
<section id="countControl"><label>目标顶点数 <output id="countOut">20,000</output><input id="count" type="range" min="5000" max="60000" step="1000" value="20000"></label></section>
<section id="depthControl" hidden><label>递归深度 <output id="depthOut">5</output><input id="depth" type="range" min="0" max="6" step="1" value="5"></label><small>递归深度 6 共 729 个三角形。</small></section>
<section><h2>渲染</h2><div class="modes"><button data-mode="points" class="active"><b>1</b> 点云</button><button data-mode="lines"><b>2</b> 线框</button><button data-mode="solid"><b>3</b> 实体</button></div><label>点大小 <output id="sizeOut">2.5 px</output><input id="pointSize" type="range" min="1" max="8" step=".5" value="2.5"></label><label>配色方案 <select id="palette"><option value="aurora">极光青</option><option value="sunset">日落橙</option><option value="violet">紫罗兰</option></select></label></section>
<section class="actions"><button id="pause">暂停生长 <kbd>Space</kbd></button><button id="reset">重置视图</button></section>
<footer><strong>WebGL 2.0</strong><span>VBO · Float32Array · gl.bufferData</span></footer></aside></main><script src="js/app.bundle.js"></script></body></html>
